<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>タスク編集</title>
</head>
<body>
	<h1>タスク編集</h1>
	
	<form th:action="@{/update}" method="post">
		
		<input type="hidden"
				name="id"
				th:value="${task.id}">
		<div>
			タイトル
			<input type="text"
					name="title"
					th:value="${task.title}">
		</div>
		
		<br>
		
		<div>
			ステータス
			
			<select name="status">
				
				<option value="未着手"
				th:selected="${task.status=='未着手'}">
				未着手
				</option>
				
				<option value="進行中"
				th:selected="${task.status=='進行中'}">
				進行中
				</option>
				
				<option value="完了"
				th:selected="task.status=='完了'">
				完了
				</option>
			</select>
		</div>
		
		<br>
		
		<button type="submit">
			更新
		</button>
		
	</form>
</body>
</html>
